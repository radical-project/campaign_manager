[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campaign-manager"
version = "0.1.0"
description = "AsyncCampaignManager — async-native HPC workflow orchestrator with adaptive scheduling"

authors = [
    {name = "Masha", email = "mg2347@soe.rutgers.edu"},
]
maintainers = [
    {name = "Masha", email = "mg2347@soe.rutgers.edu"},
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pyyaml>=6.0",
    "radical.asyncflow>=0.3.0",
    "rhapsody-py>=0.2.0",
    "nvidia-ml-py"
]

[project.optional-dependencies]
# Dragon/RADICAL HPC backend
dragon = [
    "dragonhpc>=0.13.2",
    "rhapsody-py>=0.2.0",
    "nvidia-ml-py"
]

# ADR bridge — drive campaign scheduling from a radical.adr Policy.
# radical.adr is not yet on PyPI; install editable:  pip install -e ../radical.adr
# The LLM policy additionally needs the `llm` extra below.
adr = [
    "radical.adr",
    "pydantic>=2",
]

# LLM-driven scheduling policy (LLMSchedulingPolicy)
llm = [
    "openai>=1.0.0",
    "instructor>=1.0.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "anyio>=4.0.0",
    "ruff>=0.1.0",
    "numpy>=1.24.0,<2.0.0",
]

# Documentation
doc = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]

# Plotting/metrics visualization
plotting = [
    "matplotlib>=3.7.0",
    "numpy>=1.24.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pyright]
pythonVersion = "3.10"
include = ["."]
extraPaths = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "N", "UP"]
ignore = ["UP007", "UP045", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require GPU",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.codespell]
skip = ".git,.github,__pycache__,build,dist,*.egg-info,cache,outputs"
