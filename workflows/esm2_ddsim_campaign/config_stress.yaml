# =============================================================================
# SPHERICAL Stress-Test Campaign Configuration
# =============================================================================
#
# Purpose: expose the problems that the CM + ADR are designed to solve.
#
# The scenario — "upstream-hogging":
#   inference (priority 9) competes with dummy (priority 5) for the same 16 CPU
#   slots.  The CM's two-pass scheduler GUARANTEES inference's concurrency_floor
#   (2 slots) then fills the remaining 2 pass-2 slots by priority.
#
#   policy=none : inference (9) beats dummy (5) in pass 2 → dummy is starved for
#                 the full inference runtime (4 waves × 37 s = 148 s) → 0 leads
#                 within the 90 s deadline.
#
#   policy=rule : ADR boosts dummy above inference → pass-2 slots go to dummy
#                 → 2 inf + 2 dummy run simultaneously from the first trigger
#                 → leads every ~3–5 s → 20–30 leads by deadline.
#
#   policy=bandit: learns the downstream-first ordering within 3–5 cycles.
#   policy=llm  : prompted to prioritise the terminal stage; should match rule.
#
# Expected benchmark output (--deadline 90):
#   none   →  0 leads   (wave 3 ends at t=111 s > 90 s → inference always mid-wave)
#   rule   → 20–30 leads
#   bandit → 15–25 leads  (converges within the run)
#   llm    → 15–25 leads  (if LLM endpoint is available)
#
# KEY design choices vs. the previous 30 s stub version:
#   stub_sleep_s 37 s (not 30): 30×3=90 exactly aligned the 3rd wave boundary
#   with the deadline, creating a brief CPU-free window where dummy could slip in
#   under 'none'.  37 s → wave boundaries at 0/37/74/111 s; wave 3 is always
#   mid-flight at t=90 → no free window → none stays at 0.
#   num_inputs 2 / max_sim_batch 2 / sleep_time 0.1: each dummy finishes in ~2–3 s.
#   The fast completion ensures wave-3 dummies finish before deadline even when
#   asyncio jitter pushes their start 2–3 s late (LLM is the 4th sequential run).

# ── Cluster Resources ─────────────────────────────────────────────────────────
resources:
  total_cpus: 16   # 4 concurrent workflows (4 CPUs each) — tight resource pool
  total_gpus: 0    # disabled: pure CPU benchmark, no GPU tracking

# ── Engine ────────────────────────────────────────────────────────────────────
engine: concurrent   # CPU-only, no Dragon required
debug:  false

# ── Telemetry ─────────────────────────────────────────────────────────────────
telemetry:
  collect_telemetry: true
  telemetry_dir:    "telemetry-results"
  resource_poll_interval: 0.5

# ── Campaign Manager / ADR supervision ───────────────────────────────────────
cm:
  features:
    backpressure: true   # engage BP so THROTTLE/WIDEN transitions appear in obs
    monitor:      true
    sharder:      true

  monitor_interval_s: 8   # short interval so monitor catches starvation quickly

  adr:
    policy:    none      # override with --policy at benchmark time
    tick_s:    2.0
    warmstart: true
    seed:      0
    record:    false

    system_prompt_file: prompts/scheduling_system_prompt.txt

    llm_tick_s:      5.0    # was 10 — fires every 5 s; fallback=rule covers ticks in between
    llm_timeout_s:   15.0   # tighter; avoids 20 s stall eating into the decision window
    llm_max_retries: 1      # was 0 — one retry on parse failure before falling back
    base_url:        https://router.huggingface.co/v1
    model:           meta-llama/Llama-3.3-70B-Instruct
    llm_api_key_env: HF_TOKEN

# ── Workflow Registry ────────────────────────────────────────────────────────
workflow_registry:
  dummy:     dummy_workflow.DummyWrapperWorkflow
  md:        ddmd_workflow.DDMdWrapperWorkflow
  miniapps:  miniapps_workflow.MiniAppsWrapperWorkflow
  inference: inference_workflow.InferenceWorkflow

# ── Workflow Groups ───────────────────────────────────────────────────────────

workflows:

  # ── ESM2 Inference ──────────────────────────────────────────────────────────
  # HIGH priority (9) — deliberately above dummy (5) to create starvation under
  # the 'none' baseline.  16 replicas × 37 s stub = 4 waves; wave 3 ends at
  # t=111 s > 90 s deadline → inference is ALWAYS mid-wave at deadline → 0 free
  # CPU windows → none gets 0 leads.  (30 s created an exact t=90 boundary.)
  inference:
    priority:             9          # HIGH: starves dummy under 'none' policy
    replicas:             16         # 4 waves of 4 concurrent replicas
    concurrency_floor:    2          # always keep ≥2 inference slots (pass 1)
    concurrency_cap:      4          # fills all 16 CPUs when dummy has no floor
    required_cpus:        4
    required_gpus:        0          # CPU-only stress benchmark
    stub_sleep_s:         37.0       # 37 s: wave boundaries 0/37/74/111 — no clean
                                     # boundary aligns with the 90 s deadline
    config_file:          "${INF_DIR}/config.yaml"

  # ── DDSim ───────────────────────────────────────────────────────────────────
  # LOW priority (5), NO concurrency_floor — can be completely starved by the
  # scheduler's pass-2 fill when inference has higher priority ('none' policy).
  # Fast runtime (num_inputs=2, training_epochs=0) so many completions fit in
  # the 53 s window (t=37–90) that rule/bandit/llm open up.
  dummy:
    priority:             5          # LOW: loses pass-2 contest under 'none'
    concurrency_floor:    0          # ← KEY: no guaranteed floor → full starvation possible
    concurrency_cap:      4
    required_cpus:        4
    required_gpus:        0
    dependencies:         [inference]
    config_file:          "${DUMMY_DIR}/config.yaml"
    # Override timing params: 2 sims per replica completes in ~2–3 s, so the
    # 53 s window rule/bandit/llm open up yields 15–25 leads vs 0 for none.
    num_inputs:           2          # 2 sims per replica (was 5) — faster completion
    max_sim_batch:        2          # run both sims in one batch
    training_cores:       0          # no training-slot reservation
    training_epochs:      0          # skip ML training step entirely
    sleep_time:           0.1        # 0.1 s main-loop poll interval — fast enough that a
                                     # 3 s asyncio-jitter wave delay (4th sequential run)
                                     # doesn't push wave-3 dummies past the deadline
    # Sharder: buffer triggers until we have a batch of 4, then dispatch.
    # Under 'none', triggers accumulate while dummy is starved → queue grows →
    # backpressure THROTTLE fires → shows up in bp_state observation field.
    sharding:
      target_size:        4
      min_size:           1
      max_size:           16
      stratify:           soft
    # Backpressure: THROTTLE when 8 triggers are buffered (upstream faster than
    # downstream can drain when starved); WIDEN when queue empties below 3.
    backpressure_high:    8
    backpressure_low:     3

  # ── DDMd / MiniApps (disabled in CPU benchmark) ──────────────────────────
  # Kept for completeness; benchmark.py forces replicas=0 for these.
  md:
    priority:      10
    replicas:      2
    concurrency_floor:  1
    concurrency_cap:  1
    required_cpus: 4
    required_gpus: 1
    config_file:   "${MD_DIR}/config.yaml"

  miniapps:
    priority:      8
    concurrency_floor:  1
    concurrency_cap:  1
    required_cpus: 4
    required_gpus: 1
    dependencies:  [md]
    config_file:   "${MINAPPS_DIR}/config.yaml"
    sharding: { target_size: 1, min_size: 1, max_size: 4, stratify: soft }
    backpressure_high: 4
    backpressure_low:  2
