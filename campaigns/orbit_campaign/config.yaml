# =============================================================================
# dummy_orbit Campaign
# =============================================================================
#
# Two-stage search → refine pipeline where tasks run on a remote HPC node
# via the ORBIT broker + rhapsody plugin (concurrent backend).
#
# search:  10 replicas each submit /bin/echo to the endpoint and generate
#          a random score.  Candidates below refine_threshold trigger a refine.
#
# refine:  triggered at runtime by search; submits /bin/sleep to the endpoint.
#          Campaign stops when campaign_target refine replicas finish.
#
# Prerequisites:
#   export RADICAL_ORBIT_BROKER_URL=wss://dt-login03.delta.ncsa.illinois.edu:8020
#   # Terminal 1 (login node): ./bin/radical-orbit-broker.py --port 8020
#   # Terminal 2 (compute node): ./bin/radical-orbit-endpoint.py -p rhapsody
#
# Run:
#   python run_campaign.py --config config.yaml
# =============================================================================

engine: concurrent   # asyncflow backend for CM internals

resources:
  total_cpus: 0   # 0 = unlimited
  total_gpus: 0

# ── Orbit connection (forwarded to workflow config) ───────────────────────────
# orbit_broker_url: auto-resolved from $RADICAL_ORBIT_BROKER_URL if omitted
# orbit_endpoint:   auto-selects first rhapsody endpoint if omitted

# ── Workflow groups ───────────────────────────────────────────────────────────

workflows:

  search:
    replicas:          10
    concurrency_cap:   4
    concurrency_floor: 1
    priority:          10
    required_cpus:     0
    required_gpus:     0
    # Orbit connection (passed to workflow.config)
    # orbit_broker_url: "wss://dt-login03.delta.ncsa.illinois.edu:8020"
    # orbit_endpoint:   "my-endpoint"
    # Search config
    refine_threshold:  0.5
    trigger_refine:    refine

  refine:
    replicas:          0   # triggered at runtime by search via _trigger_dependent
    concurrency_cap:   2
    concurrency_floor: 1
    priority:          8
    required_cpus:     0
    required_gpus:     0
    campaign_target:   5
    # Refine task config
    duration:          0.3   # seconds for /bin/sleep
    score_decay:       0.6
    score_noise:       0.05

# ── Campaign manager ──────────────────────────────────────────────────────────

cm:
  features:
    backpressure: false
    sharder:      false
    monitor:      false

# ── Workflow registry ─────────────────────────────────────────────────────────

workflow_registry:
  search: orbit_workflow.OrbitWorkflow
  refine: orbit_workflow.OrbitWorkflow
