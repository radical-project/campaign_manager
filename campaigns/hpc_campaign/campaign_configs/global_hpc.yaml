# Global CampaignManager configuration — Dragon / SLURM (Delta HPC).
# Used by delta_sbatch.sh via --global-config campaign_configs/global_hpc.yaml.
# telemetry.dir is passed as a CLI flag from the sbatch script so SLURM_JOB_ID
# can be embedded in the path.

engine: dragon
verbose: false

scheduling:
  policy: bandit

telemetry:
  enabled: true
  dir: ~                                      # set via --telemetry-dir in sbatch script
