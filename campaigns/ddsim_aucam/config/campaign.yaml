# Campaign template — local / dev defaults.
# Each campaign run by the driver gets a copy of this config with a per-campaign
# score_delta applied (see config.py:vary_config).
#
# Timing note (local dev):
#   ddsim_a: 10 steps × 0.10 s ≈ 1.0 s/run
#   ddsim_b:  5 steps × 0.30 s ≈ 1.5 s/run
#   analysis: 3 steps × 0.05 s ≈ 0.15 s/run
# With goal_analyses=6 and 4 max-concurrent workflows, expect ~8–12 s per campaign.

controller:
  goal_analyses: 6            # stop after this many analysis completions
  score_ceiling: 0.90         # cancel ddsim runs whose score climbs above this

budget:
  max_concurrent: 4           # max parallel workflows inside this campaign
  max_concurrency_per_workflow: 2
  spending: {}                # e.g. {cpu_hours: 0.05}

workflows:
  ddsim_a:
    n_steps: 10
    step_sleep_s: 0.10
    score_noise: 0.08
    stale_timeout_s: 120.0

  ddsim_b:
    n_steps: 5
    step_sleep_s: 0.30
    score_noise: 0.03
    stale_timeout_s: 120.0

  analysis:
    steps: 3
    step_sleep_s: 0.05

policy_interval_s: 0.5
shutdown_timeout_s: 10.0
checkpoint_dir: ~             # null = no checkpointing
score_delta: 0.0              # overridden per-campaign by driver via vary_config()
