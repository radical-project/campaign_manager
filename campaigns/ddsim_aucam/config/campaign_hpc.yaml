# Campaign template — Dragon / SLURM (Delta HPC).
# Longer step times (real asyncflow blocks), more analyses per campaign,
# spending limit per campaign so the global budget rejection demo works.
#
# Timing estimate per ddsim_a run: 100 steps × 0.5 s = 50 s
# Timing estimate per ddsim_b run:  30 steps × 1.5 s = 45 s
# Timing estimate per analysis run:  20 steps × 0.5 s = 10 s
# With goal_analyses=10 and 3 concurrent, expect ~3–4 min per campaign.

controller:
  goal_analyses: 10
  score_ceiling: 0.90

budget:
  max_concurrent: 3
  max_concurrency_per_workflow: 2
  spending:
    cpu_hours: 0.150          # per-campaign spending limit

workflows:
  ddsim_a:
    n_steps: 100
    step_sleep_s: 0.50
    score_noise: 0.06
    stale_timeout_s: 600.0

  ddsim_b:
    n_steps: 30
    step_sleep_s: 1.50
    score_noise: 0.02
    stale_timeout_s: 600.0

  analysis:
    steps: 20
    step_sleep_s: 0.50

policy_interval_s: 2.0
shutdown_timeout_s: 30.0
checkpoint_dir: ~
score_delta: 0.0
