# Global CampaignManager configuration — Dragon / SLURM (Delta HPC).
# Used by delta_dragon_sbatch.sh via --global-config config/global_hpc.yaml.
# telemetry.dir is still passed as a CLI flag from the sbatch script so
# SLURM_JOB_ID can be embedded in the path.
#
# Parallel driver pattern: all 4 campaigns are submitted immediately; only 2
# run at a time (max_concurrent=2 in global_hpc.yaml; override on CLI).

engine: dragon
asyncflow_blocks: true
verbose: false

driver:
  num_campaigns: 4
  max_concurrent: 2           # two campaigns run simultaneously on two nodes

scheduling:
  policy: bandit

global_budget:
  max_concurrent_campaigns: ~               # controlled via driver.max_concurrent
  max_total_concurrent_workflows: ~
  spending:
    # Total cpu_hours budget for all 4 campaigns combined.
    # Each HPC campaign runs ~50 analyses × (50 s ddsim_a + 10 s analysis) ≈ few minutes.
    # Set a cap to demonstrate rejection if campaigns overshoot.
    cpu_hours: 0.500

telemetry:
  enabled: true
  dir: ~                                    # set via --telemetry-dir in sbatch script
