# Campaign template — HPC (Delta SLURM, GPU node, concurrent engine).
#
# Each campaign runs two arms simultaneously:
#   miniapps_fast — num_step as given below
#   miniapps_slow — num_step × slow_step_multiplier
#
# Estimated runtime per replica (1× A100, concurrent backend):
#   fast: total_num_sim=20, num_step=1 000  →  ~15–30 min
#   slow: total_num_sim=20, num_step=3 000  →  ~45–90 min
# With goal_n=6 and max_concurrent=2, expect ~1–3 h per campaign.

controller:
  goal_n: 6
  score_ceiling: 0.95

budget:
  max_concurrent: 2
  max_concurrency_per_workflow: 1
  spending:
    cpu_hours: 0.25       # ~6 completions at ~120–220 s each; 0 or remove to disable

miniapps:
  total_num_sim:          20
  max_sim_batch:           4    # 4 concurrent sims; GPU freed for training between batches
  training_cores:          4
  miniapps_data_ready:     5    # start training after 5 sims complete
  num_step:             1000    # fast arm; slow arm = num_step × slow_step_multiplier
  num_epochs:            200
  stale_timeout_s:      1800.0
  home_dir: ""                  # empty → ~/MiniApps
  debug: false
  free_resources_for_train: true
  clean_unregistered_sims: true
  executable: "${MINIAPPS_VE}/bin/python"

slow_step_multiplier: 3   # miniapps_slow uses num_step × this

# Declared spending per workflow arm (wall_hours, cpu_hours, gpu_hours).
# Budget accounting: reserved at launch, settled (prorated) at completion.
# Option A (max_wall_time_s set) → actual ≤ declared; Option B → overrun allowed.
workflows:
  fast_spending:
    wall_hours:  0.5     # ~15–30 min; used as proration denominator
    cpu_hours:   0.5     # 16 CPUs × 0.5 h but most time is GPU-bound sims
    gpu_hours:   0.05    # GPU used only for training (~few min out of 30)
  # slow_spending omitted → fast_spending × slow_step_multiplier (× 3)

policy_interval_s: 10.0
shutdown_timeout_s: 300.0
checkpoint_dir: ~
