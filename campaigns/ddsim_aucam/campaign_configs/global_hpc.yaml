# Global CampaignManager configuration — Delta HPC (SLURM).
#
# The engine is controlled by the ENGINE env var in delta_sbatch.sh and
# passed via --engine; the value here is only used for local runs that
# load this file directly.
#
# Parallel driver: submits all 4 campaigns at once, runs 2 at a time.

engine: concurrent
verbose: false

driver:
  num_campaigns: 4
  max_concurrent: 2

scheduling:
  policy: bandit

global_budget:
  max_total_concurrent_workflows: ~
  spending: {}

telemetry:
  enabled: true
  dir: ~                        # set via --telemetry-dir in delta_sbatch.sh
