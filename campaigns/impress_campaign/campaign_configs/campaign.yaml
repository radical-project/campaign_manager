# IMPRESS AuCaM campaign — local / dev defaults.
#
# Supports two modes:
#   one type:    the `impress` workflow type alone; pass --spec to run_campaign.py
#   multi-arm:  three difficulty arms (binding_tractable / binding_borderline / binding_refractory)
#               driven by the bandit; pass --multi-arm to run_campaign.py
#
# Score: `progress` from CampaignDigest — fraction of the requested Pareto
# front that is satisfied (0–1; higher is better).  Per-objective bests
# (ligand_iptm, complex_plddt, …) are logged on completion.

controller:
  goal_n: 30             # runs that must reach the front before the campaign stops
  budget_warn_fraction: 0.80  # log a WARNING when this fraction of budget is used

budget:
  max_concurrent: 6             # 2 of each type in parallel
  max_concurrency_per_workflow: 2  # concurrent instances per type; tractable fills both
  capacity:                     # resources the CM makes available to all workflows
    cpus: 48                    # 6 × 8 = 48 max theoretical demand
    gpus: 6
  spending:                     # campaign-wide total across all workflow instances
    cpu_hours: 10.0
    gpu_hours: 10.0
  # Instead of stating spending, state the allocation: AuCaM works the limit
  # out as capacity x wall_hours, so the budget matches the job it runs in
  # (--wall-hours on the CLI).  A dimension named in `spending` is kept.
  # wall_hours: 4.0
  on_limit: cancel              # at the limit: cancel running workflows, or "finish"
  # Load-aware launching (needs telemetry): how many workflows may run follows
  # how busy the nodes are, never above max_concurrent.
  target_utilization: 0.85
  max_waiting_tasks: ~          # ~ : twice max_concurrent
  overcommit: 1.0               # >1 hands out more than the capacity while there is room

workflows:
  # ── One workflow type, via --spec ─────────────────────────────────────────
  impress:
    # AuCaM cancels a workflow that exceeds these limits.  IMPRESS-A also
    # enforces the same budget from the inside (gate 5 and the commitment
    # ledger refuse unaffordable graphs before any task runs), so AuCaM's
    # cancel is a backstop rather than the primary mechanism.
    spending_limit:
      cpu_hours: 2.0
      gpu_hours: 0.5
    # budget_floor:
    #   cpu_hours: 0.006
    #   gpu_hours: 0.006
    resources:
      cpus: 4
      gpus: 1
    stale_timeout_s: 3600.0
    respect_limit: true
    score_floor: 0.0           # cancel this workflow mid-run if progress drops below this (0 = off)

  # ── Multi-arm demo: tractable / borderline / refractory, by difficulty ────
  # Each type runs up to 8 IMPRESS cycles and emits progress after each,
  # giving the bandit enough signal to learn which arm is worth launching.
  binding_tractable:
    spending_limit:
      gpu_hours: 0.5    # cpu_hours omitted: mock tools use ~2µs CPU; AuCaM would learn a
                        # sub-floor spending_limit and drop all launches (backlog G20)
    budget_floor:
      gpu_hours: 0.07   # interlock: pattern_cost=0.006 must stay ≤ 10% of spending_limit;
                        # floor prevents AuCaM narrowing to 0.0075 (too low) after 3+ runs
    resources:
      cpus: 4
      gpus: 1
    stale_timeout_s: 120.0
    score_floor: 0.0

  binding_borderline:
    spending_limit:
      gpu_hours: 0.5    # see binding_tractable note
    resources:
      cpus: 4
      gpus: 1
    stale_timeout_s: 120.0
    score_floor: 0.0

  binding_refractory:
    spending_limit:
      gpu_hours: 0.5    # see binding_tractable note
    resources:
      cpus: 4
      gpus: 1
    stale_timeout_s: 120.0
    score_floor: 0.0           # set >0 to cut losing runs early

policy_interval_s: 1.0
shutdown_timeout_s: 60.0
checkpoint_dir: ~
