# IMPRESS campaign — local / dev defaults.
#
# Each campaign runs one IMPRESS-A arm at a time (single workflow type).
# The workflow block wraps a full IMPRESS-A design campaign: plan → score
# → Pareto front.  Budget is enforced per-workflow; the controller cancels
# runs that exceed the spending limit and stops the campaign after goal_n
# completions.
#
# Score: `progress` from CampaignDigest — fraction of the requested Pareto
# front that is satisfied (0–1; higher is better).  Per-objective bests
# (ligand_iptm, complex_plddt, …) are logged on completion.
#
# Estimated runtime depends heavily on the IMPRESS spec (number of designs,
# number of Boltz scoring rounds).  A small local test with --no-guard and a
# mock spec can complete in under a minute.

controller:
  goal_n: 20             # ambitious goal — budget will be exhausted before this is reached
  budget_warn_fraction: 0.80  # log a WARNING when this fraction of budget is used

budget:
  max_concurrent: 2             # max parallel IMPRESS workflows
  max_concurrency_per_workflow: 1
  capacity:                     # resources the CM makes available to all workflows
    cpus: 8
    gpus: 2
  spending:                     # campaign-wide total across all workflow instances
    cpu_hours: 10.0
    gpu_hours: 10.0

workflows:
  impress:
    # AuCaM cancels a workflow that exceeds these limits.  IMPRESS-A also
    # enforces the same budget from the inside (gate 5 and the commitment
    # ledger refuse unaffordable graphs before any task runs), so AuCaM's
    # cancel is a backstop rather than the primary mechanism.
    spending_limit:
      cpu_hours: 2.0
      gpu_hours: 0.5
    # Minimum viable spending_limit per dimension: set to the cost of one IMPRESS
    # design cycle so AuCaM drops launches that would immediately be rejected by
    # gate 5.  When workflow_config() is built from the IMPRESS offer this is
    # populated automatically; set it here only to override.
    # budget_floor:
    #   cpu_hours: 0.006
    #   gpu_hours: 0.006
    resources:
      cpus: 4
      gpus: 1
    stale_timeout_s: 3600.0    # cancel workflow if no report received in this window
    respect_limit: true
    score_floor: 0.0           # cancel this workflow mid-run if progress drops below this (0 = off)

policy_interval_s: 5.0
shutdown_timeout_s: 60.0
checkpoint_dir: ~
