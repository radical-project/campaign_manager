# MEDIUM ARM — difficulty 0.70
# Chain math at difficulty 0.70: ss_fraction≈0.33 → sc_mean≈0.483 < 0.55 gate.
# IMPORTANT: d must be EXACTLY 0.70 — the only safe value.
#   d=0.70: ss_base=0.33, noise=±0.03 → ss_min=0.30 (never below integrity floor)
#           sc_pass_rate=0% (simulation over 2000 cycles)
#   d>0.70: ss_min < 0.30 → has_secondary_structure integrity gate fires → CampaignAborted
#   d<0.70: sc_pass_rate > 0% (e.g. d=0.60: 15%) → triggers "every spec objective satisfied"
# Runs 40 cycles (~3s) so at least one instance is in-flight when easy reaches goal_n,
# demonstrating AuCaM mid-run cancellation (cancelled > 0 in the summary).
campaign_id: mock-binding-medium
goal: "Design one small-molecule binder meeting every declared threshold"
backend: concurrent
backend_config: {workers: 4}
tool_delivery: mock
max_cycles: 8
stagnation_limit: 8
target_front: 1
site: {gpu_api: cuda, gpus_per_node: 1, nodes: 1, allow_external: false}
budget:
  gpu_hours: 4.0
  cpu_hours: 4.0
stages: [mock_rfd3_design, mock_mpnn_design, mock_packmin, mock_fastrelax,
         mock_filter_shape, mock_boltz_predict]
params:
  mock_rfd3_design:
    num_designs: 1
    diffusion_steps: 50
    difficulty: 0.70        # ss_fraction≈0.33 → sc_mean≈0.483; sim shows 0% pass rate (15% at 0.60)
  mock_mpnn_design:
    temperature: 0.2
    batch_size: 8
    number_of_batches: 1
  mock_packmin:
    cycles: 1
  mock_fastrelax:
    nstruct: 1
    relax_cycles: 3
  mock_boltz_predict:
    diffusion_samples: 8
replicas: 1
concurrency: 1
objectives:
  - {name: total_score,            direction: minimize}
  - {name: shape_complementarity,  direction: maximize, min: 0.55}
  - {name: complex_plddt,          direction: maximize, min: 0.75}
  - {name: ligand_iptm,            direction: maximize, min: 0.4}
