# =============================================================================
# ddsim_campaign — full-features flat campaign
# =============================================================================
#
# Exercises all CM features in a single flat (non-benchmark) run:
#   backpressure, score-aware slack, sharder, triage cutoff, budget controller,
#   is_source / _infer_terminal auto-detection.
#
#   ddsim_a  (fast / high-score feeder)
#            20 replicas, 0.10 s/rep, score_mean=0.75 — high-quality source.
#
#   ddsim_b  (slow / low-score feeder)
#            20 replicas, 0.30 s/rep, score_mean=0.35 — lower-quality source.
#
#   analysis
#            Triggered dynamically; backpressure with score-aware slack:
#            effective_high = int(high_water × (1 + score_quality × score_slack))
#            Example: high_water=2, score_slack=0.3, score_quality=0.8 → high=2.
#            Sharder stratifies incoming work; triage drops below score_cutoff=0.30.
#
# is_source / _infer_terminal verification:
#   ddsim_a and ddsim_b have no upstream dependencies → auto-detected as sources.
#   analysis has no downstream dependencies → auto-detected as terminal.
#
# Run:
#   python run_campaign.py --config config_features.yaml --policy rule
# =============================================================================

engine: concurrent

resources:
  total_cpus: 6
  total_gpus: 0

workflows:

  ddsim_a:
    replicas:          20
    concurrency_cap:   3
    concurrency_floor: 1
    priority:          10
    required_cpus:     1
    required_gpus:     0
    duration:          0.10
    jitter:            0.02
    score_mean:        0.75   # high-score feeder
    score_noise:       0.10
    trigger_analysis:  analysis

  ddsim_b:
    replicas:          20
    concurrency_cap:   3
    concurrency_floor: 1
    priority:          9
    required_cpus:     1
    required_gpus:     0
    duration:          0.30
    jitter:            0.05
    score_mean:        0.35   # low-score feeder
    score_noise:       0.08
    trigger_analysis:  analysis

  analysis:
    replicas:                  0      # triggered dynamically by both sim stages
    concurrency_cap:           4
    concurrency_floor:         1
    priority:                  8
    required_cpus:             1
    required_gpus:             0
    duration:                  0.15
    jitter:                    0.03
    refinement_a:              0.85
    refinement_b:              0.70
    backpressure_high:         2
    backpressure_low:          1
    backpressure_score_slack:  0.3    # effective_high raised by up to 30% for high-quality buffers
    sharding:
      target_size:  5
      stratify:     soft
      profile:      diverse_top
    triage:
      score_cutoff:        0.30
      score_cutoff_bounds: [0.10, 0.70]

cm:
  features:
    backpressure: true
    sharder:      true
    monitor:      false
    budget:       true

  adr:
    policy:    rule
    tick_s:    0.5
    terminal:  analysis

    goals:
      n_target: 25
      n_budget: 80

    system_prompt_file: prompts/scheduling_system_prompt.txt
    llm_tick_s:        2.0
    llm_timeout_s:     15.0
    llm_max_retries:   1

    base_url:       https://router.huggingface.co/v1
    model:          meta-llama/Llama-3.3-70B-Instruct
    llm_api_key_env: HF_TOKEN

workflow_registry:
  ddsim_a:  ddsim_workflow.DdSimWorkflow
  ddsim_b:  ddsim_workflow.DdSimWorkflow
  analysis: ddsim_workflow.AnalysisWorkflow
